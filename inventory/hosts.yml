---
all:
  children:
    opnsense:
      vars:
        # L'API/WebGUI HTTPS des pare-feux est exposee sur ce port.
        opnsense_api_port: 1000
        ansible_connection: local
      hosts:
        opnsense-web1:
          ansible_host: 10.0.0.254
        opnsense-web2:
          ansible_host: 172.20.20.254
        opnsense-web2lfm:
          ansible_host: 172.20.100.254
        opnsense-web3:
          ansible_host: 172.30.20.254
        opnsense-web3pp:
          ansible_host: 172.30.40.254
